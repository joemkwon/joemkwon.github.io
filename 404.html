<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#080d12">
    <title>404 — Joe Kwon</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 18px; }
        body {
            font-family: Georgia, 'Times New Roman', serif;
            background-color: #080d12;
            color: #D5DAE1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            line-height: 1.75;
        }
        main { max-width: 32rem; }
        h1 {
            font-size: 2.5rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            color: #9AB0C8;
        }
        p { color: #7A8088; margin-bottom: 1.5rem; font-style: italic; }
        a {
            color: #D5DAE1;
            text-decoration: none;
            border-bottom: 1px solid #6A7A8A;
            transition: color 0.3s ease, border-color 0.3s ease;
        }
        a:hover { color: #9AB0C8; }
        a:focus-visible { outline: 2px solid #9AB0C8; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <h1>404</h1>
        <p>
            This page drifted off somewhere past the drop-off, where the water
            goes from turquoise to something almost black.
        </p>
        <a href="/">Surface back to the homepage</a>
    </main>
</body>
</html>
